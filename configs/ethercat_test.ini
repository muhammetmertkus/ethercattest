; ==============================================================================
; LinuxCNC INI Configuration - Optimized for EtherCAT 1-Axis Test
; Drive: Delta ASDA-A3-E EtherCAT AC Servo Sürücü | Encoder SCALE: 1677721.6
; ==============================================================================

[EMC]
VERSION = 1.1
MACHINE = GMTCNT_EtherCAT_Test
DEBUG = 0

[DISPLAY]
DISPLAY = axis
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 2.0
DEFAULT_LINEAR_VELOCITY = 50.0
MAX_LINEAR_VELOCITY = 250.0
DEFAULT_ACCELERATION = 1000.0
MAX_ACCELERATION = 3000.0

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[RS274NGC]
PARAMETER_FILE = linuxcnc.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[HAL]
HALFILE = ethercat_test.hal

[TRAJ]
COORDINATES = X
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 50.0
MAX_LINEAR_VELOCITY = 250.0
DEFAULT_LINEAR_ACCELERATION = 1000.0
MAX_LINEAR_ACCELERATION = 3000.0

[KINS]
JOINTS = 1
KINEMATICS = trivkins coordinates=X

[AXIS_X]
MIN_LIMIT = -999999.0
MAX_LIMIT = 999999.0
MAX_VELOCITY = 250.0
MAX_ACCELERATION = 3000.0

[JOINT_0]
TYPE = LINEAR
MIN_LIMIT = -999999.0
MAX_LIMIT = 999999.0
MAX_VELOCITY = 250.0
MAX_ACCELERATION = 3000.0
FERROR = 5.0
MIN_FERROR = 1.0
SCALE = 1677721.60
